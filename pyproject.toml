[project]
name = "affinity-ml"
version = "0.1.0"
description = "Reproducible recommendation models and evaluation for Affinity"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1.3",
  "mlflow>=2.17.2",
  "numpy>=2.1.3",
  "polars>=1.12.0",
  "pydantic>=2.9.2",
  "scikit-learn>=1.5.2",
  "sentence-transformers>=3.2.1",
  "torch>=2.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3", "pytest-cov>=6.0.0", "ruff>=0.7.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/affinity_ml"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

