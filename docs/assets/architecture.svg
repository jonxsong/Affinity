<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Affinity system architecture</title>
  <desc id="desc">Behavioral events enter a Rust API, flow through durable data infrastructure into Python model training, and return through a multi-stage ranking pipeline to the developer console.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#323232"/></marker>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1"/></filter>
    <style>
      .bg{fill:#fffdf8}.box{stroke:#292929;stroke-width:2;filter:url(#wobble)}.shadow{fill:none;stroke:#292929;stroke-width:1;opacity:.3}.title{font:700 23px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#202020}.label{font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#202020}.small{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#565656}.tiny{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#626262}.line{fill:none;stroke:#323232;stroke-width:2;stroke-linecap:round;marker-end:url(#arrow);filter:url(#wobble)}.dash{stroke-dasharray:8 7}.group{fill:none;stroke:#9b9b9b;stroke-width:1.5;stroke-dasharray:7 7;rx:20}.group-label{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.5px;fill:#777;text-transform:uppercase}
    </style>
  </defs>
  <rect class="bg" width="1400" height="850" rx="18"/>
  <text x="54" y="54" class="title">AFFINITY / learning loop</text>
  <text x="54" y="80" class="small">observed behavior → representations → candidates → explained ranking</text>

  <rect x="35" y="115" width="290" height="675" class="group"/>
  <text x="55" y="141" class="group-label">experience</text>
  <rect x="70" y="178" width="220" height="92" rx="13" fill="#e8f7ef" class="box"/><rect x="74" y="182" width="220" height="92" rx="13" class="shadow"/>
  <text x="95" y="216" class="label">Next.js console</text><text x="95" y="242" class="small">explore · compare · debug</text>
  <rect x="70" y="331" width="220" height="90" rx="13" fill="#eeeafa" class="box"/><rect x="74" y="335" width="220" height="90" rx="13" class="shadow"/>
  <text x="95" y="368" class="label">SDKs / clients</text><text x="95" y="394" class="small">events + recommend calls</text>
  <rect x="70" y="566" width="220" height="102" rx="13" fill="#fff2d8" class="box"/><rect x="74" y="570" width="220" height="102" rx="13" class="shadow"/>
  <text x="95" y="604" class="label">Ranked results</text><text x="95" y="630" class="small">scores + explanations</text><text x="95" y="650" class="tiny">model version attached</text>

  <rect x="362" y="115" width="365" height="675" class="group"/>
  <text x="382" y="141" class="group-label">online path · rust</text>
  <rect x="403" y="178" width="280" height="92" rx="13" fill="#dff3ff" class="box"/><rect x="407" y="182" width="280" height="92" rx="13" class="shadow"/>
  <text x="428" y="215" class="label">Axum API gateway</text><text x="428" y="240" class="small">validate · trace · authorize</text>
  <rect x="403" y="331" width="280" height="90" rx="13" fill="#dff3ff" class="box"/><rect x="407" y="335" width="280" height="90" rx="13" class="shadow"/>
  <text x="428" y="368" class="label">Event ingestion</text><text x="428" y="393" class="small">dedupe · batch · dead letter</text>
  <rect x="403" y="566" width="280" height="102" rx="13" fill="#dff3ff" class="box"/><rect x="407" y="570" width="280" height="102" rx="13" class="shadow"/>
  <text x="428" y="603" class="label">Ranking policy</text><text x="428" y="628" class="small">filter · score · diversify</text><text x="428" y="649" class="tiny">popularity fallback</text>

  <rect x="765" y="115" width="260" height="675" class="group"/>
  <text x="785" y="141" class="group-label">state</text>
  <rect x="803" y="178" width="184" height="78" rx="13" fill="#ffe9e1" class="box"/><text x="830" y="212" class="label">Redpanda</text><text x="830" y="235" class="small">event log</text>
  <rect x="803" y="305" width="184" height="78" rx="13" fill="#e8f7ef" class="box"/><text x="830" y="339" class="label">PostgreSQL</text><text x="830" y="362" class="small">durable records</text>
  <rect x="803" y="432" width="184" height="78" rx="13" fill="#fff2d8" class="box"/><text x="830" y="466" class="label">Redis</text><text x="830" y="489" class="small">feature cache</text>
  <rect x="803" y="559" width="184" height="78" rx="13" fill="#eeeafa" class="box"/><text x="830" y="593" class="label">Qdrant</text><text x="830" y="616" class="small">item vectors</text>
  <rect x="803" y="686" width="184" height="64" rx="13" fill="#f0f0f0" class="box"/><text x="830" y="724" class="label">MLflow</text>

  <rect x="1060" y="115" width="305" height="675" class="group"/>
  <text x="1080" y="141" class="group-label">offline path · python</text>
  <rect x="1100" y="178" width="225" height="90" rx="13" fill="#fff2d8" class="box"/><rect x="1104" y="182" width="225" height="90" rx="13" class="shadow"/>
  <text x="1125" y="214" class="label">Event consumer</text><text x="1125" y="239" class="small">recoverable offsets</text>
  <rect x="1100" y="331" width="225" height="90" rx="13" fill="#fff2d8" class="box"/><rect x="1104" y="335" width="225" height="90" rx="13" class="shadow"/>
  <text x="1125" y="367" class="label">Feature pipeline</text><text x="1125" y="392" class="small">temporal · recency aware</text>
  <rect x="1100" y="484" width="225" height="105" rx="13" fill="#eeeafa" class="box"/><rect x="1104" y="488" width="225" height="105" rx="13" class="shadow"/>
  <text x="1125" y="519" class="label">Model training</text><text x="1125" y="544" class="small">SVD · two tower</text><text x="1125" y="566" class="small">GRU4Rec · popularity</text>
  <rect x="1100" y="651" width="225" height="87" rx="13" fill="#e8f7ef" class="box"/><rect x="1104" y="655" width="225" height="87" rx="13" class="shadow"/>
  <text x="1125" y="686" class="label">Evaluation</text><text x="1125" y="711" class="small">temporal holdout</text>

