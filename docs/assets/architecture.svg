<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Affinity system architecture</title>
  <desc id="desc">A hand-drawn architecture diagram. Clients call a Rust API, which persists behavior in PostgreSQL and returns explained recommendations. A Python worker claims durable jobs and writes model artifacts and registry records.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#303332"/></marker>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.15"/></filter>
    <style>
      .bg{fill:#fffdf8}.box{stroke:#292b2a;stroke-width:2;filter:url(#wobble)}.shadow{fill:none;stroke:#292b2a;stroke-width:1;opacity:.28}.title{font:700 23px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#202322}.label{font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#202322}.small{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#555b59}.tiny{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#666c6a}.line{fill:none;stroke:#303332;stroke-width:2;stroke-linecap:round;marker-end:url(#arrow);filter:url(#wobble)}.dash{stroke-dasharray:8 7}.group{fill:none;stroke:#999f9d;stroke-width:1.5;stroke-dasharray:7 7;rx:20}.group-label{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.5px;fill:#737977}
    </style>
  </defs>
  <rect class="bg" width="1400" height="820" rx="18"/>
  <text x="54" y="52" class="title">AFFINITY / production learning loop</text>
  <text x="54" y="78" class="small">observed behavior → durable state → explained ranking → reproducible learning</text>
  <rect x="35" y="110" width="270" height="635" class="group"/><text x="55" y="137" class="group-label">EXPERIENCE</text>
  <rect x="66" y="176" width="208" height="92" rx="13" fill="#e8f7ef" class="box"/><rect x="70" y="180" width="208" height="92" rx="13" class="shadow"/><text x="91" y="213" class="label">Next.js console</text><text x="91" y="239" class="small">inspect · tune · debug</text>
  <rect x="66" y="330" width="208" height="92" rx="13" fill="#eeeafa" class="box"/><rect x="70" y="334" width="208" height="92" rx="13" class="shadow"/><text x="91" y="367" class="label">SDKs / clients</text><text x="91" y="393" class="small">events + requests</text>
  <rect x="66" y="570" width="208" height="104" rx="13" fill="#fff2d8" class="box"/><rect x="70" y="574" width="208" height="104" rx="13" class="shadow"/><text x="91" y="608" class="label">Ranked results</text><text x="91" y="634" class="small">scores + evidence</text><text x="91" y="655" class="tiny">request + model IDs</text>
  <rect x="338" y="110" width="340" height="635" class="group"/><text x="358" y="137" class="group-label">ONLINE PATH · RUST</text>
  <rect x="378" y="176" width="260" height="92" rx="13" fill="#dff3ff" class="box"/><rect x="382" y="180" width="260" height="92" rx="13" class="shadow"/><text x="403" y="213" class="label">Axum API</text><text x="403" y="239" class="small">validate · trace · authorize</text>
  <rect x="378" y="330" width="260" height="92" rx="13" fill="#dff3ff" class="box"/><rect x="382" y="334" width="260" height="92" rx="13" class="shadow"/><text x="403" y="367" class="label">Event ingestion</text><text x="403" y="393" class="small">dedupe · batch · transact</text>
  <rect x="378" y="570" width="260" height="104" rx="13" fill="#dff3ff" class="box"/><rect x="382" y="574" width="260" height="104" rx="13" class="shadow"/><text x="403" y="607" class="label">Ranking policy</text><text x="403" y="633" class="small">filter · score · diversify</text><text x="403" y="654" class="tiny">cold-start fallback</text>
  <rect x="712" y="110" width="260" height="635" class="group"/><text x="732" y="137" class="group-label">DURABLE STATE</text>
  <rect x="750" y="176" width="184" height="124" rx="13" fill="#ffe9e1" class="box"/><rect x="754" y="180" width="184" height="124" rx="13" class="shadow"/><text x="775" y="211" class="label">PostgreSQL</text><text x="775" y="238" class="small">events · content</text><text x="775" y="260" class="small">models · jobs</text><text x="775" y="282" class="small">experiments</text>
  <rect x="750" y="365" width="184" height="98" rx="13" fill="#e8f7ef" class="box"/><rect x="754" y="369" width="184" height="98" rx="13" class="shadow"/><text x="775" y="401" class="label">Artifacts</text><text x="775" y="427" class="small">weights · factors</text><text x="775" y="447" class="tiny">metrics + manifest</text>
  <rect x="750" y="570" width="184" height="104" rx="13" fill="#f1f1f1" class="box"/><rect x="754" y="574" width="184" height="104" rx="13" class="shadow"/><text x="775" y="605" class="label">Extensions</text><text x="775" y="630" class="small">Qdrant · Redis</text><text x="775" y="651" class="tiny">Redpanda · MLflow</text>
  <rect x="1007" y="110" width="358" height="635" class="group"/><text x="1027" y="137" class="group-label">OFFLINE PATH · PYTHON</text>
  <rect x="1048" y="176" width="276" height="92" rx="13" fill="#fff2d8" class="box"/><rect x="1052" y="180" width="276" height="92" rx="13" class="shadow"/><text x="1073" y="213" class="label">Training worker</text><text x="1073" y="239" class="small">lock · claim · recover</text>
  <rect x="1048" y="330" width="276" height="92" rx="13" fill="#fff2d8" class="box"/><rect x="1052" y="334" width="276" height="92" rx="13" class="shadow"/><text x="1073" y="367" class="label">Temporal protocol</text><text x="1073" y="393" class="small">split · no future leakage</text>
  <rect x="1048" y="484" width="276" height="112" rx="13" fill="#eeeafa" class="box"/><rect x="1052" y="488" width="276" height="112" rx="13" class="shadow"/><text x="1073" y="520" class="label">Four recommenders</text><text x="1073" y="546" class="small">popularity · SVD</text><text x="1073" y="568" class="small">two tower · GRU4Rec</text>
  <rect x="1048" y="650" width="276" height="66" rx="13" fill="#e8f7ef" class="box"/><rect x="1052" y="654" width="276" height="66" rx="13" class="shadow"/><text x="1073" y="690" class="label">Evaluate + register</text>
  <path d="M274 222 C320 222 333 222 378 222" class="line"/><text x="311" y="209" class="tiny">HTTP</text><path d="M274 376 C320 376 333 376 378 376" class="line"/><path d="M508 268 C508 292 508 306 508 330" class="line"/>
  <path d="M638 376 C686 376 706 238 750 238" class="line"/><path d="M750 258 C700 258 685 622 638 622" class="line"/><text x="662" y="474" class="tiny">read</text><path d="M378 622 C330 622 318 622 274 622" class="line"/>
  <path d="M934 221 C980 221 1001 221 1048 221" class="line dash"/><text x="963" y="208" class="tiny">queued job</text><path d="M1186 268 C1186 293 1186 306 1186 330" class="line"/><path d="M1186 422 C1186 448 1186 461 1186 484" class="line"/><path d="M1186 596 C1186 620 1186 630 1186 650" class="line"/>
  <path d="M1048 683 C993 683 980 414 934 414" class="line"/><text x="966" y="568" class="tiny">artifacts</text><path d="M1048 683 C990 683 974 275 934 275" class="line dash"/><text x="950" y="346" class="tiny">registry</text><path d="M934 622 C978 622 993 622 1048 622" class="line dash"/><text x="960" y="608" class="tiny">optional</text>
  <path d="M50 773 C210 763 330 780 495 771 S770 777 930 769 S1180 777 1350 768" fill="none" stroke="#9df7d2" stroke-width="4" stroke-linecap="round" opacity=".85" filter="url(#wobble)"/><text x="1022" y="788" class="tiny">solid = active path · dashed = async / optional</text>
</svg>
