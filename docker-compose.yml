name: affinity

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      api: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://affinity:affinity@postgres:5432/affinity
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  ml:
    build:
      context: .
      dockerfile: services/ml-service/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./artifacts:/app/artifacts
    profiles: ["training"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: affinity
      POSTGRES_USER: affinity
      POSTGRES_PASSWORD: affinity
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affinity"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant-data:/qdrant/storage"]

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command: redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr redpanda:9092
    ports: ["9092:9092", "9644:9644"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlruns"]
    profiles: ["training"]

  k6:
    image: grafana/k6:0.55.0
    volumes:
      - ./benchmarks:/scripts:ro
    network_mode: host
    profiles: ["benchmark"]

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  redpanda-data:
  mlflow-data:

